[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bm25s>=0.3.14",
    "fire>=0.7.1",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.14.1",
    "pystemmer>=3.1.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
]

[tool.pyright]
include = ["src"]
exclude = ["data", ".venv", "**/__pycache__"]
reportMissingTypeStubs = false
venvPath = "/tmp"
venv = "rag-venv"
reportExplicitAny = false
reportUnknownMemberType = false
reportAny = false
